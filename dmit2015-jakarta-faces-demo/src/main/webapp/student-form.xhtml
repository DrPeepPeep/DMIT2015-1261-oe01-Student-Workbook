<!DOCTYPE html>
<html xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="primefaces"
      xmlns:p="jakarta.faces.core">
<head>
    <meta charset="UTF-8"/>
    <title>Simple Facelet Page</title>
</head>
<h:body>

    <p:form>
        <p:messages showDetail="true" />

        <p:panel header="Student Registration" />

            <p:outoutLabel for="fullName" value="Full Name" />
            <p:inputText id="fullName" />

        <br />
        <br />

        <p:outputLabel
        <p:selectOneMenu id="program"
                         value="#{studentFromBean.program}"
                         required="true"
                         requiredMessage="Program is Required"   />
    </p:form>

</h:body>
</html>
